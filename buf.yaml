version: v2
modules:
  - path: proto
lint:
  use: [STANDARD]
  # lps.v1 is the published compatibility API. These naming rules would require
  # source/JSON-breaking renames of existing enum values and RPC message types.
  except:
    - ENUM_VALUE_PREFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use: [FILE]
