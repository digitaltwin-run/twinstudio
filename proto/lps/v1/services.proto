syntax = "proto3";

package lps.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "lps/v1/commands.proto";
import "lps/v1/events.proto";
import "lps/v1/project.proto";
import "lps/v1/simulation.proto";

message ProjectIdRequest {
  string project_id = 1;
}

message EventStreamRequest {
  string project_id = 1;
  int64 after_version = 2;
}

service CommandService {
  rpc Execute(CommandEnvelope) returns (EventBatch);
  rpc PlanScopedChange(PlanScopedChangeRequest) returns (ChangePlan);
  rpc ApplyChangePlan(ApplyChangePlanRequest) returns (EventBatch);
}

service QueryService {
  rpc GetProject(ProjectIdRequest) returns (ProjectSnapshot);
  rpc GetUnifiedSpecification(ProjectIdRequest) returns (UnifiedSpecification);
  rpc StreamEvents(EventStreamRequest) returns (stream EventEnvelope);
}

service SimulationService {
  rpc Run(SimulationRequest) returns (SimulationResult);
}
