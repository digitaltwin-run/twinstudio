syntax = "proto3";

package lps.v1;

import "google/protobuf/timestamp.proto";
import "lps/v1/geometry.proto";

option java_multiple_files = true;
option java_package = "io.livingproductstudio.v1";
option csharp_namespace = "LivingProductStudio.V1";

message Membership {
  string project_id = 1;
  string email = 2;
  string role = 3;
  string granted_by = 4;
  google.protobuf.Timestamp granted_at = 5;
}

message AccessRequest {
  string project_id = 1;
  string requested_email = 2;
  string requested_role = 3;
  string requested_by = 4;
  string decision_email = 5;
  string message = 6;
}

message AccessDecision {
  string invitation_id = 1;
  string status = 2;
  string decision_by = 3;
  google.protobuf.Timestamp decided_at = 4;
}

message Annotation {
  string uri = 1;
  RegionSelection selection = 2;
  string text = 3;
  string status = 4;
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Approval {
  string uri = 1;
  string project_id = 2;
  string subject_uri = 3;
  string decision = 4;
  string comment = 5;
  string decided_by = 6;
  google.protobuf.Timestamp decided_at = 7;
}
