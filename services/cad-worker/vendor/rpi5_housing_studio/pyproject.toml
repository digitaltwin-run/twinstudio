[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi5-housing-studio"
version = "1.0.0"
description = "Parametric 2D/3D housing generator with a FastAPI preview UI and LiteLLM configuration compiler."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{ name = "Housing Studio" }]
dependencies = [
  "cadquery>=2.8.0,<3",
  "ezdxf>=1.4.4,<2",
  "trimesh>=4.11,<5",
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "reportlab>=4.2,<5",
  "numpy>=1.26,<3",
  "python-dotenv>=1,<2"
]

[project.optional-dependencies]
llm = [
  "litellm>=1,<2"
]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1"
]

[project.scripts]
housing-generator = "generator:main"

[tool.setuptools]
py-modules = ["generator"]

[tool.setuptools.packages.find]
where = ["."]
include = ["housing_studio*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
