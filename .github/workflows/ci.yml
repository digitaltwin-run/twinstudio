name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e "./components/housing-studio[dev]"
      - run: ruff check .
      - run: python scripts/generate_schemas.py
      - name: Checkout pinned Wellmanifest DSL standard
        run: |
          git init "$RUNNER_TEMP/wellmanifest-dsl"
          git -C "$RUNNER_TEMP/wellmanifest-dsl" remote add origin https://github.com/wellmanifest/dsl.git
          git -C "$RUNNER_TEMP/wellmanifest-dsl" fetch --depth=1 origin 550e5f441c709e15f2679c1af151352d1eba2f1e
          git -C "$RUNNER_TEMP/wellmanifest-dsl" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/wellmanifest-dsl" rev-parse HEAD)" = 550e5f441c709e15f2679c1af151352d1eba2f1e
      - name: Validate NL/DSL boundary against Wellmanifest
        run: PYTHONPATH=src WELLMANIFEST_DSL_ROOT="$RUNNER_TEMP/wellmanifest-dsl" python scripts/verify_dsl_conformance.py
      - name: Validate portable EDA history hash chain
        run: PYTHONPATH=src python scripts/verify_eda_history.py --allow-missing
      - run: python scripts/verify_project.py --run-tests
      - run: python -m pytest -q components/housing-studio/tests
      - run: git diff --exit-code schemas
  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Buf 1.72.0
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/bufbuild/buf/releases/download/v1.72.0/buf-Linux-x86_64 \
            --output "${RUNNER_TEMP}/buf"
          echo "8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af  ${RUNNER_TEMP}/buf" \
            | sha256sum --check --strict
          sudo install --mode 0755 "${RUNNER_TEMP}/buf" /usr/local/bin/buf
      - run: buf lint
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: bash -n scripts/deploy_compose.sh
      - run: docker compose config --quiet
