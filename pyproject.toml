[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinstudio"
version = "0.5.0"
description = "Event-sourced collaborative product digital-thread studio with scoped NL-to-2D-to-3D edits, design-fixation lenses, simulations and artifact generation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "TwinStudio" }]
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "typer>=0.16,<1",
  "PyYAML>=6.0,<7",
  "paho-mqtt>=2.1,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "reportlab>=4,<5",
  "svglib>=1.5,<1.6"
]

[project.optional-dependencies]
llm = ["litellm>=1,<2"]
dev = ["httpx2>=2.10,<3", "playwright>=1.50,<2", "pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
twinstudio = "twinstudio.cli:app"
lps = "twinstudio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["twinstudio*", "living_product_studio*"]

[tool.setuptools.package-data]
twinstudio = [
  "static/*",
  "static/vendor/three/*",
  "data/*.yaml",
  "data/*.ebnf",
  "data/*.json"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
