    summary: Examine dimensional variation, stack-ups, process drift and fit robustness.
    prompts: ["Which tolerance drives cost without protecting function?", "Where should compliance or adjustment absorb variation?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [tolerance, quality]
  - id: inspectability
    order: 16
    name: Inspectability
    category: lifecycle_value
    summary: Consider how critical characteristics are measured, observed and accepted.
    prompts: ["Can the feature be inspected without destructive access?", "Which datum or indicator would make verification unambiguous?"]
