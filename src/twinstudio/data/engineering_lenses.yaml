catalog_version: "2026.08-twinstudio-engineering-1"
title: "TwinStudio engineering and lifecycle lenses"
declared_lens_count: 36
active_lens_count: 36
catalog_kind: twinstudio_extension
source_notes:
  - "These lenses are TwinStudio engineering extensions, not rows transcribed from the supplied fifty-viewing-lenses table."
  - "They complement the source-grounded physical lenses with system, digital, lifecycle, risk, evidence and value concerns."
lenses:
  - id: purpose_value
    order: 1
    name: Purpose and value
    category: functional_behavioral
    summary: Clarify the outcome, beneficiary and value created by the selected object.
    prompts: ["What outcome must remain even if the current object disappears?", "Who receives value and how is it measured?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [goal, value]
  - id: primary_function
    order: 2
    name: Primary function
    category: functional_behavioral
    summary: Describe the essential transformation without naming the current mechanism.
    prompts: ["What verb-object pair expresses the indispensable change?", "Could another mechanism perform the same transformation?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [function, goal]
  - id: secondary_functions
    order: 3
    name: Secondary functions
    category: functional_behavioral
    summary: Identify supporting, convenience and protective functions.
    prompts: ["Which secondary function is carried accidentally by the current geometry?", "Can two functions be combined or separated?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [function]
  - id: inputs_outputs
    order: 4
    name: Inputs and outputs
    category: functional_behavioral
    summary: Trace matter, energy, information and human actions entering and leaving the system.
    prompts: ["Which input can be removed, reused or sensed?", "Which output is useful, harmful or currently invisible?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [flow, system]
  - id: states_modes
    order: 5
    name: States and modes
    category: functional_behavioral
    summary: Examine operating, standby, assembly, transport, fault and service states.
    prompts: ["Which state is missing or ambiguous?", "Can geometry or software make state transitions safer and clearer?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [behavior, state]
  - id: sequence_logic
    order: 6
    name: Sequence and logic
    category: functional_behavioral
    summary: Examine ordering, dependencies and conditional behavior.
    prompts: ["What must happen before, after or only when another event occurs?", "Can a sequence be shortened, parallelized or made mistake-proof?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [behavior, process]
  - id: adaptability_configurability
    order: 7
    name: Adaptability and configurability
    category: functional_behavioral
    summary: Consider parameters, variants, self-adjustment and context-specific behavior.
    prompts: ["Which fixed choice should become configurable?", "Can one platform cover several variants without unnecessary complexity?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [variant, adaptation]
  - id: interfaces
    order: 8
    name: Interfaces
    category: interface_system
    summary: Examine mechanical, electrical, fluid, optical, data and human interfaces.
    prompts: ["Which interface is implicit, fragile or under-specified?", "Can the interface become standard, keyed, reversible or self-identifying?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [interface]
  - id: interoperability
    order: 9
    name: Interoperability
    category: interface_system
    summary: Examine compatibility with tools, components, protocols and ecosystems.
    prompts: ["What external standard could reduce custom work?", "Which dependency prevents substitution or future integration?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [interface, standard]
  - id: modularity
    order: 10
    name: Modularity
    category: interface_system
    summary: Examine replaceable modules, stable boundaries and independent evolution.
    prompts: ["Which change should not force redesign of the whole product?", "Where is a clean module boundary worth the added interface?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [architecture, module]
  - id: standardization
    order: 11
    name: Standardization
    category: interface_system
    summary: Consider common parts, dimensions, protocols and reusable design rules.
    prompts: ["Which bespoke element could become standard?", "Where would standardization damage useful differentiation?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [standard, reuse]
  - id: dependencies
    order: 12
    name: Dependencies and coupling
    category: interface_system
    summary: Trace technical, supplier, software and organizational coupling.
    prompts: ["Which dependency is hidden until a change is attempted?", "Can coupling be reduced, made explicit or monitored?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [dependency, architecture]
  - id: manufacturability
    order: 13
    name: Manufacturability
    category: lifecycle_value
    summary: Examine process capability, support needs, tooling, yield and repeatability.
    prompts: ["Which feature exists against the natural strengths of the process?", "Can geometry improve yield without losing function?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [dfm, manufacturing]
  - id: assembly_disassembly
    order: 14
    name: Assembly and disassembly
    category: lifecycle_value
    summary: Examine joining sequence, access, orientation, error prevention and reversibility.
    prompts: ["Which assembly step is awkward or irreversible?", "Can the product guide correct assembly and later disassembly?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
