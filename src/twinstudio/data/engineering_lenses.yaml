    summary: Examine sensing, control loops, user feedback and automatic correction.
    prompts: ["What state should be sensed rather than assumed?", "Can passive feedback replace active control or vice versa?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [control, feedback]
  - id: data_telemetry
    order: 21
    name: Data and telemetry
    category: digital_control
