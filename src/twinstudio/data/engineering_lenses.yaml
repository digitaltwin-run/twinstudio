    category: digital_control
    summary: Examine software behavior, versioning, update paths and hardware-software boundaries.
    prompts: ["Could software absorb a physical variant or create an unsafe dependency?", "How are versions, rollback and compatibility controlled?"]
    enabled: true
    source_status: extension
    provenance: twinstudio_extension
    tags: [software, firmware]
  - id: diagnostics_observability
    order: 23
    name: Diagnostics and observability
    category: digital_control
    summary: Examine how faults, wear and performance are detected and explained.
    prompts: ["Which failure remains invisible until damage occurs?", "Can a passive witness mark, sensor or log expose it earlier?"]
