catalog_version: twinstudio-lifecycle-2026.08-v1
templates:
- template_id: product-evolution
  name: Full product evolution
  description: End-to-end lifecycle from evidence intake through release and retained learning.
  tags:
  - product
  - hardware
  - software
  - regulated-ready
  feedback_loops:
  - from: experiment
    to: goal_expansion
  - from: verification
    to: resource_decomposition
  - from: learning
    to: frame
  stages:
  - phase: intake
    name: Evidence intake
    objective: Collect source artifacts, claims, constraints, observations, and current-state baselines.
    entry_criteria:
    - A project and at least one target exist.
    exit_criteria:
    - Critical sources are linked and provenance is recorded.
    required_outputs:
    - evidence inventory
    - current-state snapshot
    approver_roles: []
    parallel_allowed: false
  - phase: frame
    name: Problem framing
    objective: State the problem without committing to the current mechanism.
    entry_criteria:
    - Evidence intake is complete enough to identify the challenge.
    exit_criteria:
    - Outcome, boundaries, preserve conditions, avoid conditions, and unknowns are explicit.
    required_outputs:
    - goal frame
    - assumption register
    approver_roles:
    - creator
    - admin
    parallel_allowed: false
  - phase: goal_expansion
    name: Goal expansion
    objective: Expand the action verb upward, downward, sideways, and toward meaningful opposites.
    entry_criteria:
    - A goal verb or action phrase is available.
    exit_criteria:
    - Multiple reviewable goal variants exist.
    required_outputs:
    - goal network
    approver_roles: []
    parallel_allowed: false
  - phase: assumption_discovery
    name: Assumption discovery
    objective: Use source and extension lenses to expose assumptions hidden in wording and current features.
    entry_criteria:
    - Goal variants exist.
    exit_criteria:
    - Underexplored lenses and high-impact assumptions are recorded.
    required_outputs:
    - lens coverage
    - hidden assumptions
    approver_roles: []
    parallel_allowed: false
  - phase: resource_decomposition
    name: Resource decomposition
    objective: Decompose product objects into parts, features, materials, parameters, interfaces, evidence, and actions.
    entry_criteria:
    - Targets are addressable through POA.
    exit_criteria:
    - A traceable resource network exists.
    required_outputs:
    - resource network
    approver_roles: []
    parallel_allowed: false
  - phase: bridge_building
    name: Bidirectional bridge building
    objective: Connect goal variants to available resources and capabilities through candidate mechanisms.
    entry_criteria:
    - Goal and resource networks exist.
    exit_criteria:
    - At least one traceable solution path exists.
    required_outputs:
    - bidirectional graph
    - bridge candidates
    approver_roles: []
    parallel_allowed: false
  - phase: divergence
    name: Divergent evolution
    objective: Generate multiple generations through mutation, crossover, and adjacent-possible associations.
    entry_criteria:
    - Seed bridge candidates exist.
    exit_criteria:
    - Population and lineage meet configured size and diversity.
    required_outputs:
    - candidate population
    - lineage graph
    approver_roles: []
    parallel_allowed: false
  - phase: adjacent_possible
    name: Adjacent possible exploration
    objective: Traverse obscure or underused features toward nearby mature mechanisms.
    entry_criteria:
    - At least one candidate and one underexplored lens exist.
    exit_criteria:
    - Adjacent associations are represented or explicitly rejected.
    required_outputs:
    - association paths
    approver_roles: []
    parallel_allowed: false
  - phase: convergence
    name: Convergence and scoring
    objective: Score candidates against constraints, evidence, risk, lifecycle fit, and value.
    entry_criteria:
    - Candidate population exists.
    exit_criteria:
    - A shortlist is traceable to weights and evidence.
    required_outputs:
    - scorecard
    - shortlist
    approver_roles:
    - creator
    - admin
    parallel_allowed: false
  - phase: prototype
    name: Prototype planning
    objective: Define the smallest reversible prototype for the most uncertain candidate assumptions.
    entry_criteria:
    - Shortlisted candidates exist.
    exit_criteria:
    - Prototype artifacts and success criteria are specified.
    required_outputs:
    - prototype plan
    approver_roles: []
    parallel_allowed: false
  - phase: experiment
    name: Experiment and test
    objective: Test whether candidate paths actually satisfy the goal rather than merely looking plausible.
    entry_criteria:
    - Testable prototypes or simulations are available.
    exit_criteria:
    - Results and failed assumptions are recorded.
    required_outputs:
    - test results
    - updated evidence
    approver_roles: []
    parallel_allowed: false
  - phase: selection
    name: Selection
    objective: Select, reject, merge, or return candidates for another generation.
    entry_criteria:
    - Comparable evidence and scorecards exist.
    exit_criteria:
    - A decision with rationale and owner is recorded.
    required_outputs:
    - selection decision
    approver_roles:
    - creator
    - admin
    parallel_allowed: false
  - phase: realization
    name: Realization
    objective: Translate the selected candidate into scoped change plans and generated artifacts.
    entry_criteria:
    - A candidate is selected and approval policy is satisfied.
    exit_criteria:
    - Change plans are generated or safe operations are applied.
    required_outputs:
    - change plan
    - affected-object list
    approver_roles:
    - creator
    - admin
    parallel_allowed: false
  - phase: verification
    name: Verification
    objective: Verify requirements, interfaces, manufacturability, and regressions after realization.
    entry_criteria:
    - Changed artifacts or a realized prototype exist.
    exit_criteria:
    - Acceptance criteria pass or deviations are explicitly accepted.
    required_outputs:
    - verification evidence
    - traceability update
    approver_roles:
    - creator
    - admin
    parallel_allowed: false
  - phase: learning
    name: Learning
    objective: Preserve rejected paths, failed tests, new evidence, and reusable mechanisms.
    entry_criteria:
    - Experiments or verification produced evidence.
    exit_criteria:
    - Reusable knowledge and next hypotheses are recorded.
    required_outputs:
    - learning record
    - updated lexicon or lens notes
    approver_roles: []
    parallel_allowed: false
  - phase: release
    name: Release
    objective: Package approved artifacts, documentation, manufacturing data, and operational handover.
    entry_criteria:
    - Verification and approvals are complete.
    exit_criteria:
    - Release bundle is reproducible and signed off.
    required_outputs:
    - release bundle
    - release notes
    approver_roles:
    - creator
    - admin
    parallel_allowed: false
  - phase: archive
    name: Archive
    objective: Preserve lineage, evidence, source models, and retirement or next-evolution triggers.
    entry_criteria:
    - Release or cancellation decision exists.
    exit_criteria:
    - Record retention and future access are defined.
    required_outputs:
    - archive manifest
    approver_roles: []
    parallel_allowed: false
