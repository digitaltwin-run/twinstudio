name: twinstudio
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://lps:lps@postgres:5432/lps
      LPS_DATA_DIR: /data
      MQTT_HOST: mqtt
      SMTP_HOST: mailpit
    ports: ["${LPS_HOST_PORT:-8000}:8000"]
    volumes:
      - lps-data:/data
      - ./examples:/app/examples:ro
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lps
      POSTGRES_USER: lps
      POSTGRES_PASSWORD: lps
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lps -d lps"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    ports: ["${MAILPIT_HOST_PORT:-8025}:8025"]
    restart: unless-stopped
  cad-worker:
    profiles: ["cad"]
    build:
      context: .
      dockerfile: services/cad-worker/Dockerfile
    env_file: [.env]
    environment:
      MQTT_HOST: mqtt
      LPS_DATA_DIR: /data
    volumes: ["lps-data:/data"]
    depends_on: [mqtt]
    restart: unless-stopped
  minio:
    profiles: ["object-store"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  openwebui:
    profiles: ["openwebui"]
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    ports: ["3000:8080"]
    volumes: ["openwebui-data:/app/backend/data"]
    depends_on: [app]
    restart: unless-stopped
  mqtt-gateway:
    profiles: ["integration"]
    build:
      context: .
      dockerfile: services/mqtt-gateway/Dockerfile
    environment:
      MQTT_HOST: mqtt
      MQTT_TOPIC_PREFIX: lps/v1
      LPS_API_BASE: http://app:8000
      LPS_SERVICE_EMAIL: ${LPS_SERVICE_EMAIL:-mqtt-gateway@example.test}
      LPS_SERVICE_TOKEN: ${LPS_SERVICE_TOKEN:-}
    depends_on: [app, mqtt]
    restart: unless-stopped
  device-sim:
    profiles: ["simulation"]
    build:
      context: .
      dockerfile: services/device-sim/Dockerfile
    environment:
      MQTT_HOST: mqtt
      MQTT_TOPIC_PREFIX: lps/v1
      PROJECT_ID: demo-rpi5
    volumes: ["./examples/rpi5-camera3/software:/scenario:ro"]
    depends_on: [mqtt]
networks:
  default:
    ipam:
      config:
        - subnet: 10.250.58.0/24
volumes:
  lps-data:
  postgres-data:
  mqtt-data:
  minio-data:
  openwebui-data:
