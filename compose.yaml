name: twinstudio
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TWINSTUDIO_BUILD_SHA: ${TWINSTUDIO_BUILD_SHA:-unknown}
    image: ${TWINSTUDIO_APP_IMAGE:-twinstudio-app}:${TWINSTUDIO_APP_TAG:-latest}
    env_file: [.env]
    environment:
      DATABASE_URL: ${TWINSTUDIO_COMPOSE_DATABASE_URL:-postgresql+psycopg://twinstudio:twinstudio@postgres:5432/twinstudio}
      TWINSTUDIO_BUILD_SHA: ${TWINSTUDIO_BUILD_SHA:-unknown}
      TWINSTUDIO_DATA_DIR: /data
      MQTT_HOST: mqtt
      SMTP_HOST: mailpit
    ports: ["${TWINSTUDIO_HOST_PORT:-${LPS_HOST_PORT:-8000}}:8000"]
    volumes:
      - twinstudio-data:/data
      - ./examples:/app/examples:ro
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped
    networks: [twinstudio]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: twinstudio
      POSTGRES_USER: twinstudio
      POSTGRES_PASSWORD: twinstudio
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twinstudio -d twinstudio"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [twinstudio]
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["${MQTT_HOST_PORT:-1883}:1883"]
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped
    networks: [twinstudio]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["${MAILPIT_HOST_PORT:-8025}:8025"]
    restart: unless-stopped
    networks: [twinstudio]
  cad-worker:
    profiles: ["cad"]
    build:
      context: .
      dockerfile: services/cad-worker/Dockerfile
    env_file: [.env]
    environment:
      MQTT_HOST: mqtt
      TWINSTUDIO_DATA_DIR: /data
    volumes: ["twinstudio-data:/data"]
    depends_on: [mqtt]
    restart: unless-stopped
    networks: [twinstudio]
  minio:
    profiles: ["object-store"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    networks: [twinstudio]
  openwebui:
    profiles: ["openwebui"]
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    ports: ["${OPENWEBUI_HOST_PORT:-3000}:8080"]
    volumes: ["openwebui-data:/app/backend/data"]
    depends_on: [app]
    restart: unless-stopped
    networks: [twinstudio]
  mqtt-gateway:
    profiles: ["integration"]
    build:
      context: .
      dockerfile: services/mqtt-gateway/Dockerfile
    environment:
      MQTT_HOST: mqtt
      MQTT_TOPIC_PREFIX: twinstudio/v1
      TWINSTUDIO_API_BASE: http://app:8000
      TWINSTUDIO_SERVICE_EMAIL: ${TWINSTUDIO_SERVICE_EMAIL:-mqtt-gateway@example.test}
      TWINSTUDIO_SERVICE_TOKEN: ${TWINSTUDIO_SERVICE_TOKEN:-}
    depends_on: [app, mqtt]
    restart: unless-stopped
    networks: [twinstudio]
  device-sim:
    profiles: ["simulation"]
    build:
      context: .
      dockerfile: services/device-sim/Dockerfile
    environment:
      MQTT_HOST: mqtt
      MQTT_TOPIC_PREFIX: twinstudio/v1
      PROJECT_ID: demo-rpi5
    volumes: ["./examples/rpi5-camera3/software:/scenario:ro"]
    depends_on: [mqtt]
    networks: [twinstudio]
volumes:
  twinstudio-data:
    name: ${TWINSTUDIO_DATA_VOLUME:-twinstudio_twinstudio-data}
    external: ${TWINSTUDIO_DATA_VOLUME_EXTERNAL:-false}
  postgres-data:
  mqtt-data:
  minio-data:
  openwebui-data:
networks:
  twinstudio:
